<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#12100c">
<title>Buyuk Kids — Ҳисобот</title>
<style>
:root {
  --ink:   #12100c;
  --paper: #f7f4ed;
  --line:  #d8d2c4;
  --muted: #6f6857;
  --ok:    #1f6f43;
  --warn:  #a86a12;
  --bad:   #a32020;
  --tag:   #fffdf7;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body {
  margin: 0; padding: 0; background: var(--ink); color: var(--ink);
  font-family: ui-sans-serif, system-ui, "Segoe UI", Roboto, Arial, sans-serif;
  font-size: 16px; line-height: 1.35;
}
body { min-height: 100vh; display: flex; flex-direction: column; }
.wrap { width: 100%; max-width: 940px; margin: 0 auto; }

header { background: var(--ink); color: var(--paper); padding: 14px 14px 0; }
header .bar { display: flex; align-items: baseline; gap: 10px; }
header .mark { font-size: 13px; font-weight: 700; letter-spacing: .18em; text-transform: uppercase; }
header .who { font-size: 12px; color: #8f8878; margin-left: auto; }
header button.ic { background: none; border: 0; color: #8f8878; font-size: 19px; cursor: pointer; padding: 0 2px; }

.tabs { display: flex; gap: 20px; padding: 12px 0 0; }
.tab { background: none; border: 0; padding: 0 0 10px; color: #6b6455;
  font-size: 13px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase;
  border-bottom: 2px solid transparent; cursor: pointer; }
.tab.on { color: var(--paper); border-bottom-color: var(--paper); }

.controls { background: var(--ink); padding: 10px 14px 14px; }
.chips { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 7px; }
.chips:last-child { margin-bottom: 0; }
.chip { background: none; border: 2px solid #3a352b; border-radius: 3px; color: #8f8878;
  font-size: 12px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase;
  padding: 8px 11px; cursor: pointer; }
.chip.on { background: var(--paper); color: var(--ink); border-color: var(--paper); }

main { flex: 1; padding: 0 14px 30px; }

/* Жами */
.jami { background: var(--tag); border-radius: 3px; padding: 18px; margin-bottom: 10px; }
.jami .davr { font-size: 11px; letter-spacing: .12em; text-transform: uppercase;
  color: var(--muted); margin-bottom: 14px; }
.grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 2px 22px; }
.kv { border-top: 1px solid var(--line); padding: 9px 0; }
.kv .lab { font-size: 11px; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
.kv .val { font-size: 23px; font-weight: 700; font-variant-numeric: tabular-nums; }
.kv.big { grid-column: 1 / -1; border-top: 2px solid var(--ink); }
.kv.big .val { font-size: 44px; line-height: 1.05; }
.ok { color: var(--ok); } .warn { color: var(--warn); } .bad { color: var(--bad); }

/* Рўйхат */
.lst { background: var(--tag); border-radius: 3px; overflow: hidden; }
.it { padding: 13px 16px; border-top: 1px solid var(--line); }
.it:first-child { border-top: 0; }
.it.clk { cursor: pointer; }
.it.clk:hover { background: #f2eee3; }
.it .top { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; }
.it .nm { font-size: 16px; font-weight: 650; line-height: 1.25; }
.it .fd { font-size: 19px; font-weight: 700; font-variant-numeric: tabular-nums; white-space: nowrap; }
.it .bot { display: flex; justify-content: space-between; gap: 12px; margin-top: 5px;
  font-size: 12px; color: var(--muted); }
.it .bot span { font-variant-numeric: tabular-nums; }
.it .ulush { height: 3px; background: var(--line); margin-top: 8px; }
.it .ulush i { display: block; height: 3px; background: var(--ink); }

.note { color: #8f8878; text-align: center; padding: 40px 20px; font-size: 15px; }
.note strong { color: var(--paper); display: block; font-size: 17px; margin-bottom: 6px; }
.err { background: var(--bad); color: #fff; padding: 16px 18px; border-radius: 3px; }
.err b { display: block; font-size: 12px; letter-spacing: .12em; text-transform: uppercase;
  opacity: .8; margin-bottom: 4px; }
.busy { color: #8f8878; text-align: center; padding: 40px; font-size: 14px;
  letter-spacing: .1em; text-transform: uppercase; }

dialog { border: 0; border-radius: 4px; padding: 0; background: var(--paper);
  color: var(--ink); width: min(93vw, 460px); }
dialog::backdrop { background: rgba(18,16,12,.75); }
.dlg { padding: 20px; }
.dlg h2 { margin: 0 0 4px; font-size: 19px; }
.dlg p { margin: 0 0 14px; font-size: 13px; color: var(--muted); }
.dlg label { display: block; font-size: 11px; letter-spacing: .1em; text-transform: uppercase;
  color: var(--muted); margin: 12px 0 5px; }
.dlg input { width: 100%; font-size: 17px; padding: 11px 12px; background: #fff;
  color: var(--ink); border: 2px solid var(--line); border-radius: 3px; }
.dlg .acts { display: flex; gap: 8px; margin-top: 20px; }
.btn { border: 0; border-radius: 3px; font-size: 14px; font-weight: 700; letter-spacing: .05em;
  text-transform: uppercase; padding: 13px 18px; background: var(--ink); color: var(--paper); cursor: pointer; }
.btn.ghost { background: none; color: var(--muted); border: 2px solid var(--line); }
.dlg .btn { flex: 1; }

/* Чек таркиби */
.chek-hd { border-bottom: 2px solid var(--ink); padding-bottom: 10px; margin-bottom: 4px; }
.chek-hd .rq { font-size: 20px; font-weight: 700; }
.chek-hd .sn { font-size: 12px; color: var(--muted); letter-spacing: .06em; }
.satr { display: flex; justify-content: space-between; gap: 12px;
  padding: 8px 0; border-top: 1px solid var(--line); font-size: 14px; }
.satr .s-nm { flex: 1; }
.satr .s-q { color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; }
.satr .s-v { font-weight: 650; font-variant-numeric: tabular-nums; white-space: nowrap; }
</style>
</head>
<body>

<header>
  <div class="wrap">
    <div class="bar">
      <span class="mark">Buyuk Kids</span>
      <span class="who" id="kim"></span>
      <button class="ic" id="yangila" title="Янгилаш">↻</button>
      <button class="ic" id="sozlama" title="Созламалар">⚙</button>
    </div>
    <div class="tabs">
      <button class="tab on" data-pane="kunlik">Кунлик</button>
      <button class="tab" data-pane="top">Топ</button>
      <button class="tab" data-pane="cheklar">Чеклар</button>
    </div>
  </div>
</header>

<div class="controls">
  <div class="wrap">
    <div class="chips" id="davrlar">
      <button class="chip" data-davr="bugun">Бугун</button>
      <button class="chip" data-davr="hafta">7 кун</button>
      <button class="chip on" data-davr="oy">Ой</button>
      <button class="chip" data-davr="30">30 кун</button>
      <button class="chip" data-davr="yil">Йил</button>
    </div>
    <div class="chips" id="turlar" style="display:none">
      <button class="chip on" data-tur="tovar">Товар</button>
      <button class="chip" data-tur="guruh">Гуруҳ</button>
      <button class="chip" data-tur="sotuvchi">Сотувчи</button>
      <button class="chip" data-tur="mijoz">Мижоз</button>
    </div>
  </div>
</div>

<main><div class="wrap" id="ekran"><div class="busy">Юкланмоқда…</div></div></main>

<dialog id="dlg">
  <form method="dialog" class="dlg">
    <h2>Кириш</h2>
    <p>ERP фойдаланувчиси. Бир марта киритилади.</p>
    <label for="usr">Фойдаланувчи</label>
    <input type="text" id="usr" autocomplete="username">
    <label for="pwd">Парол</label>
    <input type="password" id="pwd" autocomplete="current-password">
    <div class="acts">
      <button class="btn ghost" value="cancel" type="submit">Бекор</button>
      <button class="btn" value="ok" type="submit">Кириш</button>
    </div>
  </form>
</dialog>

<dialog id="chekDlg">
  <div class="dlg" id="chekTana"></div>
  <div class="dlg" style="padding-top:0">
    <button class="btn ghost" id="chekYop" style="width:100%">Ёпиш</button>
  </div>
</dialog>

<script>
(function () {
  "use strict";

  var KEY = "buyuk.erp.v1";
  var ekran = document.getElementById("ekran");
  var dlg = document.getElementById("dlg");
  var chekDlg = document.getElementById("chekDlg");
  var chekTana = document.getElementById("chekTana");

  var pane = "kunlik";
  var davr = "oy";
  var tur = "tovar";
  var soralди = false;

  // ── Созламалар ──────────────────────
  function oqi() {
    try { return JSON.parse(localStorage.getItem(KEY)) || {}; }
    catch (e) { return {}; }
  }
  function yoz(s) { try { localStorage.setItem(KEY, JSON.stringify(s)); } catch (e) {} }

  function ochDialog() {
    var s = oqi();
    document.getElementById("usr").value = s.usr || "";
    document.getElementById("pwd").value = s.pwd || "";
    dlg.showModal();
  }

  document.getElementById("sozlama").addEventListener("click", function () {
    soralди = false;
    ochDialog();
  });

  dlg.addEventListener("close", function () {
    if (dlg.returnValue !== "ok") return;
    yoz({
      usr: document.getElementById("usr").value.trim(),
      pwd: document.getElementById("pwd").value
    });
    soralди = false;
    kimniKorsat();
    yukla();
  });

  function kimniKorsat() {
    document.getElementById("kim").textContent = oqi().usr || "";
  }

  // ── Ёрдамчилар ──────────────────────
  function pul(n) {
    return String(Math.round(Number(n) || 0)).replace(/\B(?=(\d{3})+(?!\d))/g, " ");
  }
  function son(n) {
    var v = Number(n) || 0;
    return v % 1 === 0 ? String(v) : String(Math.round(v * 1000) / 1000);
  }
  function esc(t) {
    return String(t == null ? "" : t)
      .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
  }
  function rang(m) { return m >= 20 ? "ok" : (m >= 8 ? "warn" : "bad"); }

  function xato(sarlavha, matn) {
    ekran.innerHTML = '<div class="err"><b>' + esc(sarlavha) + "</b>" + esc(matn) + "</div>";
  }

  function kun(d) {
    return String(d.getFullYear()) +
      ("0" + (d.getMonth() + 1)).slice(-2) +
      ("0" + d.getDate()).slice(-2);
  }

  function oraliq() {
    var b = new Date(), a = new Date();
    if (davr === "bugun") { /* бугун */ }
    else if (davr === "hafta") { a.setDate(a.getDate() - 6); }
    else if (davr === "30") { a.setDate(a.getDate() - 29); }
    else if (davr === "yil") { a = new Date(b.getFullYear(), 0, 1); }
    else { a = new Date(b.getFullYear(), b.getMonth(), 1); }
    return { dan: kun(a), gacha: kun(b) };
  }

  // ── Сўров ───────────────────────────
  function sorov(yol) {
    var s = oqi();
    if (!s.usr) {
      xato("Кириш керак", "⚙ тугмасидан фойдаланувчи ва паролни киритинг.");
      if (!soralди) { soralди = true; ochDialog(); }
      return Promise.reject(new Error("AUTH_YOQ"));
    }
    return fetch("/v1/" + yol, {
      headers: { "Authorization": "Basic " + btoa(s.usr + ":" + s.pwd) },
      cache: "no-store"
    }).then(function (r) {
      if (r.status === 401) throw new Error("AUTH");
      if (!r.ok) throw new Error("HTTP " + r.status);
      return r.json();
    }).then(function (j) {
      if (!j.success) throw new Error(j.message || "Номаълум хатолик");
      return j.data;
    });
  }

  function xatoniKorsat(e) {
    if (e.message === "AUTH_YOQ") return;
    if (e.message === "AUTH") {
      xato("Кириш рад этилди", "Фойдаланувчи ёки парол нотўғри.");
      if (!soralди) { soralди = true; ochDialog(); }
    } else if (e instanceof TypeError) {
      xato("Сервер жавоб бермади", "Интернетни текширинг.");
    } else {
      xato("Хатолик", e.message);
    }
  }

  // ── Кунлик ──────────────────────────
  function kunlikChiz(d) {
    var j = d.jami || {}, m = Number(j.marja_foizi) || 0;
    var html =
      '<div class="jami">' +
        '<div class="davr">' + esc(d.dan) + " — " + esc(d.gacha) + "</div>" +
        '<div class="grid">' +
          '<div class="kv big"><div class="lab">Фойда</div>' +
            '<div class="val ' + rang(m) + '">' + pul(j.foyda) + "</div></div>" +
          '<div class="kv"><div class="lab">Савдо</div><div class="val">' + pul(j.savdo) + "</div></div>" +
          '<div class="kv"><div class="lab">Таннарх</div><div class="val">' + pul(j.tannarx) + "</div></div>" +
          '<div class="kv"><div class="lab">Маржа</div>' +
            '<div class="val ' + rang(m) + '">' + m.toFixed(1) + "%</div></div>" +
          '<div class="kv"><div class="lab">Чеклар</div><div class="val">' + (j.cheklar || 0) + "</div></div>" +
          '<div class="kv"><div class="lab">Ўртача чек</div><div class="val">' + pul(j.urtacha_chek) + "</div></div>" +
        "</div></div>";

    var k = d.kunlar || [];
    if (!k.length) { ekran.innerHTML = html + '<div class="note">Бу даврда савдо йўқ.</div>'; return; }

    var eng = 0, i;
    for (i = 0; i < k.length; i++) eng = Math.max(eng, Number(k[i].savdo) || 0);

    html += '<div class="lst">';
    for (i = 0; i < k.length; i++) {
      var r = k[i], rm = Number(r.marja_foizi) || 0;
      var u = eng ? Math.round((Number(r.savdo) || 0) / eng * 100) : 0;
      html +=
        '<div class="it">' +
          '<div class="top"><span class="nm">' + esc(r.kun) + "</span>" +
            '<span class="fd ' + rang(rm) + '">' + pul(r.foyda) + "</span></div>" +
          '<div class="bot">' +
            "<span>" + r.cheklar + " чек &nbsp;·&nbsp; савдо " + pul(r.savdo) + "</span>" +
            "<span>" + rm.toFixed(1) + "%</span></div>" +
          '<div class="ulush"><i style="width:' + u + '%"></i></div>' +
        "</div>";
    }
    ekran.innerHTML = html + "</div>";
  }

  // ── Топ ─────────────────────────────
  function topChiz(d) {
    var r = d.royxat || [];
    var html = '<div class="jami"><div class="davr">' + esc(d.dan) + " — " + esc(d.gacha) +
      "</div><div class=\"grid\"><div class=\"kv big\"><div class=\"lab\">Жами савдо</div>" +
      '<div class="val">' + pul(d.jami_savdo) + "</div></div></div></div>";

    if (!r.length) { ekran.innerHTML = html + '<div class="note">Маълумот йўқ.</div>'; return; }

    html += '<div class="lst">';
    for (var i = 0; i < r.length; i++) {
      var x = r[i], m = Number(x.marja_foizi) || 0;
      var u = Math.min(100, Number(x.ulush_foizi) || 0);
      html +=
        '<div class="it">' +
          '<div class="top"><span class="nm">' + esc(x.nomi) + "</span>" +
            '<span class="fd ' + rang(m) + '">' + pul(x.foyda) + "</span></div>" +
          '<div class="bot">' +
            "<span>" + son(x.soni) + " × &nbsp;·&nbsp; савдо " + pul(x.savdo) + "</span>" +
            "<span>" + m.toFixed(1) + "%</span></div>" +
          '<div class="ulush"><i style="width:' + u + '%"></i></div>' +
        "</div>";
    }
    ekran.innerHTML = html + "</div>";
  }

  // ── Чеклар ──────────────────────────
  function cheklarChiz(d) {
    var c = d.cheklar || [];
    var jami = 0, foyda = 0;
    for (var i = 0; i < c.length; i++) {
      jami += Number(c[i].summa) || 0;
      foyda += Number(c[i].foyda) || 0;
    }
    var m = jami ? foyda / jami * 100 : 0;

    var html = '<div class="jami"><div class="davr">' + esc(d.kun) + "</div>" +
      '<div class="grid">' +
        '<div class="kv big"><div class="lab">Савдо</div><div class="val">' + pul(jami) + "</div></div>" +
        '<div class="kv"><div class="lab">Фойда</div><div class="val ' + rang(m) + '">' + pul(foyda) + "</div></div>" +
        '<div class="kv"><div class="lab">Чеклар</div><div class="val">' + c.length + "</div></div>" +
      "</div></div>";

    if (!c.length) { ekran.innerHTML = html + '<div class="note">Бу кунда чек йўқ.</div>'; return; }

    html += '<div class="lst">';
    for (i = 0; i < c.length; i++) {
      var r = c[i];
      var tulov = [];
      if (r.naqd) tulov.push("нақд " + pul(r.naqd));
      if (r.karta) tulov.push("карта " + pul(r.karta));
      if (r.ball) tulov.push("балл " + pul(r.ball));
      html +=
        '<div class="it clk" data-uid="' + esc(r.uid) + '">' +
          '<div class="top"><span class="nm">' + esc(r.vaqt) + " &nbsp; " +
            esc(r.sotuvchi || r.mijoz || "—") +
            (r.qaytarish ? ' <span class="bad">· қайтариш</span>' : "") + "</span>" +
            '<span class="fd">' + pul(r.summa) + "</span></div>" +
          '<div class="bot"><span>' + esc(tulov.join(" · ")) + "</span>" +
            "<span>фойда " + pul(r.foyda) + "</span></div>" +
        "</div>";
    }
    ekran.innerHTML = html + "</div>";

    var el = ekran.querySelectorAll(".it.clk");
    for (i = 0; i < el.length; i++) {
      el[i].addEventListener("click", function () {
        chekniOch(this.getAttribute("data-uid"));
      });
    }
  }

  function chekniOch(uid) {
    chekTana.innerHTML = '<div class="busy">Юкланмоқда…</div>';
    chekDlg.showModal();
    sorov("chek/" + encodeURIComponent(uid)).then(function (d) {
      var html =
        '<div class="chek-hd"><div class="rq">Чек № ' + esc(d.raqam) + "</div>" +
        '<div class="sn">' + esc(d.sana) + " &nbsp;·&nbsp; " + esc(d.sotuvchi) + "</div></div>";

      var s = d.satrlar || [];
      for (var i = 0; i < s.length; i++) {
        html += '<div class="satr"><span class="s-nm">' + esc(s[i].tovar) + "</span>" +
          '<span class="s-q">' + son(s[i].soni) + "</span>" +
          '<span class="s-v">' + pul(s[i].summa) + "</span></div>";
      }

      var m = d.tulov_uchun ? d.foyda / d.tulov_uchun * 100 : 0;
      html += '<div class="grid" style="margin-top:14px">' +
        '<div class="kv"><div class="lab">Тўлов учун</div><div class="val">' + pul(d.tulov_uchun) + "</div></div>" +
        '<div class="kv"><div class="lab">Фойда</div><div class="val ' + rang(m) + '">' + pul(d.foyda) + "</div></div>" +
        "</div>";

      chekTana.innerHTML = html;
    }).catch(function (e) {
      chekTana.innerHTML = '<div class="err"><b>Хатолик</b>' + esc(e.message) + "</div>";
    });
  }

  document.getElementById("chekYop").addEventListener("click", function () { chekDlg.close(); });

  // ── Юклаш ───────────────────────────
  function yukla() {
    var o = oraliq();
    ekran.innerHTML = '<div class="busy">Юкланмоқда…</div>';

    if (pane === "kunlik") {
      sorov("hisobot/kunlik?dan=" + o.dan + "&gacha=" + o.gacha)
        .then(kunlikChiz).catch(xatoniKorsat);
    } else if (pane === "top") {
      sorov("hisobot/top?dan=" + o.dan + "&gacha=" + o.gacha + "&tur=" + tur + "&limit=50")
        .then(topChiz).catch(xatoniKorsat);
    } else {
      sorov("cheklar?kun=" + o.gacha).then(cheklarChiz).catch(xatoniKorsat);
    }
  }

  function chipTanla(idish, atr, qiymat) {
    var b = idish.querySelectorAll(".chip");
    for (var i = 0; i < b.length; i++) {
      b[i].classList.toggle("on", b[i].getAttribute(atr) === qiymat);
    }
  }

  document.getElementById("davrlar").addEventListener("click", function (e) {
    var v = e.target.getAttribute("data-davr");
    if (!v) return;
    davr = v; chipTanla(this, "data-davr", v); yukla();
  });

  document.getElementById("turlar").addEventListener("click", function (e) {
    var v = e.target.getAttribute("data-tur");
    if (!v) return;
    tur = v; chipTanla(this, "data-tur", v); yukla();
  });

  document.getElementById("yangila").addEventListener("click", yukla);

  var tabs = document.querySelectorAll(".tab");
  for (var t = 0; t < tabs.length; t++) {
    tabs[t].addEventListener("click", function () {
      pane = this.getAttribute("data-pane");
      for (var i = 0; i < tabs.length; i++) tabs[i].classList.toggle("on", tabs[i] === this);
      document.getElementById("turlar").style.display = pane === "top" ? "flex" : "none";
      // Чеклар — фақат битта кун, шунинг учун давр чиплари керак эмас
      document.getElementById("davrlar").style.display = pane === "cheklar" ? "none" : "flex";
      yukla();
    });
  }

  kimniKorsat();
  if (!oqi().usr) { soralди = true; ochDialog(); } else { yukla(); }
})();
</script>
</body>
</html>
